name: prairiedog

services:
  db:
    image: pgvector/pgvector:0.8.7-pg18
    restart: unless-stopped
    environment:
      POSTGRES_DB: prairiedog
      POSTGRES_USER: prairiedog
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql
    ports:
      - 127.0.0.1:5432:5432 # local tools/tests only, never the LAN
    healthcheck:
      test: [CMD-SHELL, pg_isready -U prairiedog -d prairiedog]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: applies all module migrations, then exits. App services will wait for it.
  migrate:
    build: .
    command: [node, scripts/migrate.ts]
    environment:
      DATABASE_URL: postgres://prairiedog:${POSTGRES_PASSWORD}@db:5432/prairiedog
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

volumes:
  db-data:
